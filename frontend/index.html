<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Convert Python code to C and C++ instantly with semantic analysis and error detection">
    <meta name="theme-color" content="#2f81f7">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="TransPyC">
    <meta name="msapplication-TileColor" content="#2f81f7">
    
    <!-- Icons -->
    <link rel="icon" href="/Images/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="/Images/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/Images/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/Images/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/Images/icon-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/Images/icon-512x512.png">
    <link rel="manifest" href="/manifest.json">
    
    <title>TransPyC — Python to C/C++ Transpiler</title>
    <link rel="stylesheet" href="styles.css?v=20260331">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Header -->
    <header class="header">
        <div class="header-left">
            <div class="logo">
                <span class="logo-icon">⚡</span>
                <span class="logo-text">TransPyC</span>
                <span class="logo-badge">v1.0</span>
            </div>
            <div class="header-divider"></div>
            <span class="header-desc">Python → C / C++ Transpiler</span>
        </div>

        <div class="header-center">
            <!-- Layout Switcher -->
            <div class="layout-group">
                <span class="group-label">Layout</span>
                <div class="layout-btns">
                    <button class="layout-btn active" id="layoutSideBySide" title="Side by Side">
                        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                            <rect x="1" y="2" width="6" height="12" rx="1" fill="currentColor" opacity=".9"/>
                            <rect x="9" y="2" width="6" height="12" rx="1" fill="currentColor" opacity=".5"/>
                        </svg>
                    </button>
                    <button class="layout-btn" id="layoutStacked" title="Stacked">
                        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                            <rect x="1" y="2" width="14" height="5" rx="1" fill="currentColor" opacity=".9"/>
                            <rect x="1" y="9" width="14" height="5" rx="1" fill="currentColor" opacity=".5"/>
                        </svg>
                    </button>
                    <button class="layout-btn" id="layoutFocusInput" title="Focus Input">
                        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                            <rect x="1" y="2" width="10" height="12" rx="1" fill="currentColor" opacity=".9"/>
                            <rect x="13" y="2" width="2" height="12" rx="1" fill="currentColor" opacity=".4"/>
                        </svg>
                    </button>
                    <button class="layout-btn" id="layoutFocusOutput" title="Focus Output">
                        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                            <rect x="1" y="2" width="2" height="12" rx="1" fill="currentColor" opacity=".4"/>
                            <rect x="5" y="2" width="10" height="12" rx="1" fill="currentColor" opacity=".9"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>

        <div class="header-right">
            <!-- Target Language -->
            <div class="target-group">
                <span class="group-label">Target</span>
                <div class="target-tabs">
                    <button class="target-tab" data-value="c">C</button>
                    <button class="target-tab active" data-value="cpp">C++</button>
                </div>
            </div>

            <!-- Convert Button -->
            <button id="convertBtn" class="btn-convert">
                <span id="convertBtnIcon" class="convert-icon">▶</span>
                <span id="convertBtnText">Run</span>
                <kbd class="kbd">Ctrl↵</kbd>
            </button>

            <!-- Install App (PWA) -->
            <button id="installBtn" class="btn-install" title="Install TransPyC">
                <svg class="btn-install-icon" width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                    <path d="M8 2v7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                    <path d="M5.5 6.8 8 9.4l2.5-2.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M3 13h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                </svg>
                <span class="btn-text">Install</span>
            </button>

            <!-- Theme Toggle -->
            <button id="themeToggle" class="icon-btn" title="Toggle theme">
                <span id="themeIcon">☀️</span>
            </button>
        </div>
    </header>

    <!-- Status Bar (below header) -->
    <div class="status-bar">
        <div class="status-left">
            <span class="status-dot" id="serverDot"></span>
            <span class="status-text" id="serverStatus">Connecting…</span>
        </div>
        <div class="status-right">
            <span id="lineCount" class="status-meta">0 lines</span>
            <span class="status-sep">·</span>
            <span id="charCount" class="status-meta">0 chars</span>
            <span class="status-sep">·</span>
            <span class="status-meta">Python 3</span>
        </div>
    </div>

    <!-- Main Workspace -->
    <div class="workspace" id="workspace">

        <!-- Input Panel -->
        <div class="panel" id="inputPanel">
            <div class="panel-header">
                <div class="panel-header-left">
                    <span class="panel-lang-dot python-dot"></span>
                    <span class="panel-title">Input</span>
                    <span class="panel-lang-tag">Python</span>
                </div>
                <div class="panel-header-right">
                    <button class="icon-btn sm" id="loadExampleBtn" title="Load example">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
                    </button>
                    <button class="icon-btn sm" id="clearBtn" title="Clear editor">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg>
                    </button>
                </div>
            </div>
            <div class="editor-wrap">
                <div class="line-numbers" id="lineNumbers"></div>
                <textarea id="pythonInput" class="code-editor" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off"># TransPyC Example — Python to C/C++

def add(a, b):
    return a + b

def factorial(n):
    if n <= 1:
        return 1
    return n * factorial(n - 1)

# Main program
x = 10
y = 20
result = add(x, y)
print(result)

# Loop example
for i in range(5):
    print(i)

# Conditional
if x > y:
    print("x is greater")
elif x == y:
    print("equal")
else:
    print("y is greater")</textarea>
            </div>
        </div>

        <!-- Resize Handle -->
        <div class="resize-handle" id="resizeHandle">
            <div class="resize-grip"></div>
        </div>

        <!-- Output Panel -->
        <div class="panel" id="outputPanel">
            <div class="panel-header">
                <div class="panel-header-left">
                    <span class="panel-lang-dot cpp-dot" id="outputLangDot"></span>
                    <span class="panel-title">Output</span>
                    <span class="panel-lang-tag" id="outputTitle">C++</span>
                </div>
                <div class="panel-header-right">
                    <button class="icon-btn sm" id="copyBtn" title="Copy output">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
                    </button>
                    <button class="icon-btn sm" id="downloadBtn" title="Download file">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                    </button>
                </div>
            </div>

            <!-- Output Tabs -->
            <div class="output-tabs">
                <button class="output-tab active" data-tab="code">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
                    Code
                </button>
                <button class="output-tab" data-tab="problems">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
                    Problems
                    <span class="badge" id="problemsBadge" style="display:none">0</span>
                </button>
                <button class="output-tab" data-tab="ir">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 010 14.14M4.93 4.93a10 10 0 000 14.14"/></svg>
                    IR Tree
                </button>
            </div>

            <!-- Tab Contents -->
            <div class="tab-content active" id="tab-code">
                <div class="output-placeholder" id="outputPlaceholder">
                    <div class="placeholder-icon">⚡</div>
                    <p>Press <kbd>Ctrl + Enter</kbd> or click <strong>Run</strong> to convert</p>
                </div>
                <pre id="outputCode" class="code-output hidden"></pre>
            </div>

            <div class="tab-content" id="tab-problems">
                <div id="problemsEmpty" class="problems-empty">
                    <div class="placeholder-icon">✅</div>
                    <p>No problems detected</p>
                </div>
                <div id="problemsList" class="problems-list hidden"></div>
            </div>

            <div class="tab-content" id="tab-ir">
                <pre id="irOutput" class="code-output ir-view"></pre>
            </div>
        </div>
    </div><!-- end workspace -->

    <!-- Mobile Bottom Bar (visible only on ≤480px) -->
    <div class="mobile-bottom-bar" id="mobileBottomBar">
        <!-- Target selector mirror -->
        <div class="mobile-target-tabs">
            <button class="target-tab" data-value="c" id="mobileTargetC">C</button>
            <button class="target-tab active" data-value="cpp" id="mobileTargetCpp">C++</button>
        </div>

        <!-- Panel toggle: Input | Output -->
        <div class="mobile-panel-toggle">
            <button class="mobile-panel-btn active" id="mobilePanelInput" title="Show Python editor">⌨ Input</button>
            <button class="mobile-panel-btn" id="mobilePanelOutput" title="Show output">📄 Output</button>
        </div>

        <!-- Run button shortcut -->
        <button class="btn-convert" id="mobileRunBtn" style="padding:5px 12px;font-size:12px;">
            <span>▶</span> Run
        </button>
    </div>

    <!-- Toast Container -->
    <div id="toastContainer" class="toast-container"></div>

    <script src="app.js?v=20260331"></script>

    <!-- PWA Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/service-worker.js')
                    .then(reg => {
                        console.log('[PWA] Service Worker registered:', reg.scope);
                        
                        // Check for updates periodically
                        setInterval(() => {
                            reg.update().catch(err => console.log('[PWA] Update check failed:', err));
                        }, 60000); // Check every minute
                        
                        // Listen for updates
                        reg.addEventListener('updatefound', () => {
                            const newWorker = reg.installing;
                            newWorker.addEventListener('statechange', () => {
                                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                    // New service worker available, notify user
                                    showUpdateNotification();
                                }
                            });
                        });
                    })
                    .catch(err => console.error('[PWA] Service Worker registration failed:', err));
            });

            // Handle controller change (new SW activated)
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                console.log('[PWA] New Service Worker controller activated');
            });
        } else {
            console.warn('[PWA] Service Worker not supported in this browser');
        }

        // Show update notification when new PWA version is available
        function showUpdateNotification() {
            const toastContainer = document.getElementById('toastContainer');
            if (!toastContainer) return;

            const toast = document.createElement('div');
            toast.className = 'toast info';
            toast.innerHTML = `
                <span class="toast-icon">🔄</span>
                <div class="toast-body">
                    <strong>Update available!</strong> Reload to get the latest features.
                    <div style="margin-top: 8px; display: flex; gap: 8px;">
                        <button onclick="window.location.reload()" style="padding: 4px 12px; background: #2f81f7; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: 500;">Reload</button>
                        <button onclick="this.parentElement.parentElement.parentElement.remove()" style="padding: 4px 12px; background: transparent; color: #8b949e; border: 1px solid #30363d; border-radius: 4px; cursor: pointer; font-size: 12px;">Dismiss</button>
                    </div>
                </div>
            `;
            toastContainer.appendChild(toast);

            // Auto-remove after 10 seconds
            setTimeout(() => {
                if (toast.parentElement) toast.remove();
            }, 10000);
        }

        // Allow manual cache clearing for debugging
        window.clearPWACache = () => {
            if ('serviceWorker' in navigator && navigator.serviceWorker.controller) {
                navigator.serviceWorker.controller.postMessage({ type: 'CLEAR_CACHE' });
                console.log('[PWA] Cache clear request sent');
            }
        };
    </script>
</body>
</html>
